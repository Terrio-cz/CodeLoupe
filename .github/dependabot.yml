version: 2

# Weekly, grouped: one pull request per ecosystem and week instead of one per package. Security updates are not
# grouped by this file and open immediately once Dependabot alerts are on for the repository.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm:
        patterns: ["*"]
    # @types/node follows the Node line of Electron's main process (Electron 44 embeds Node 24), not the newest release.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint declares typescript <6.1.0 (8.71.1 and the 8.71.2 canary), so TypeScript 7 fails `npm ci` with
      # ERESOLVE. Revisit when its peer range allows 7 (CL-153).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
