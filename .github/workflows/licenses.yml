name: Licences

on:
  push:
    branches: [main, "CL-*"]
    paths:
      - build.gradle.kts
      - gradle/**
      - app/package-lock.json
      - tools/npm-licenses.mjs
      - .github/workflows/licenses.yml
  pull_request:
  schedule:
    - cron: "43 4 * * 1"

concurrency:
  group: licenses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Fails on a runtime dependency whose licence is not in gradle/allowed-licenses.json.
      - name: Gradle licences
        run: ./gradlew checkLicense --console=plain --no-daemon

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Fails on a package outside the allowlist of tools/npm-licenses.mjs.
      - name: npm licences
        run: node tools/npm-licenses.mjs app/package-lock.json --out build/npm-licenses.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-reports
          path: |
            build/reports/dependency-license/licenses.json
            build/reports/dependency-license/licenses.csv
            build/npm-licenses.json
          if-no-files-found: ignore
          retention-days: 30
