name: Release

# A tag `v<major>.<minor>.<patch>[-suffix]` builds everything (the whole of ci.yml with that version, so the unit tests and
# the installer smoke tests gate it), adds checksums, SBOMs and release notes, and creates a DRAFT GitHub Release.
# Publishing it is a decision of a person (CL-99: who may download). `workflow_dispatch` is a dry run: the same files as
# an artifact, no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without a tag, e.g. 0.0.1-rc1 (dry run: files as an artifact, no release)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is built from what main holds, never from a commit that only some branch has.
      - name: Check the tag is on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not on main" >&2; exit 1; }

      # The tag name goes through the environment, never into the script text.
      - name: Read and check the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then raw=${REF_NAME#v}; else raw=$INPUT_VERSION; fi
          if ! printf '%s' "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release version: $raw" >&2
            exit 1
          fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: release
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Builds with third-party code (Gradle plugins, npm packages), so it holds a read-only token and keeps none on disk;
    # only the `publish` job below may write, and it runs nothing but `gh`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Installers and the bundle zips of every OS built by the ci job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{installer,bundle}-{ubuntu,windows,macos}-*"
          path: assets
          merge-multiple: true

      # CycloneDX: the daemon and CLI (Gradle runtime classpath) and what the app ships from npm. Electron and Chromium
      # come inside the installer with their own LICENSES files and are not in the npm SBOM.
      - name: SBOMs
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew cyclonedxDirectBom -PreleaseVersion="$VERSION" --console=plain --no-daemon
          cp build/reports/cyclonedx-direct/bom.json "assets/codeloupe-$VERSION-daemon-sbom.cdx.json"
          (cd app && npm ci --ignore-scripts && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file "../assets/codeloupe-$VERSION-app-sbom.cdx.json")

      # electron-updater trusts the SHA-512 and size in these two files (CL-107): they must match the installers beside them.
      - name: Check the update feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node tools/feed-check.mjs assets --version "$VERSION"

      - name: Checksums
        run: (cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # winget, Scoop and Homebrew manifests from the files above (CL-130). Package managers install without the Mark
      # of the Web and the cask drops the quarantine flag, which is what makes an unsigned release painless. Only
      # generated here: submitting them to winget-pkgs, a Scoop bucket or a tap is the owner's step.
      - name: Packaging manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node tools/packaging-manifests.mjs --dir assets --version "$VERSION" --repo "$REPOSITORY" --out manifests
          (cd manifests && zip -qr ../assets/packaging-manifests.zip .)
          (cd assets && sha256sum packaging-manifests.zip >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then node tools/release-notes.mjs "$REF_NAME" > notes.md; else node tools/release-notes.mjs HEAD > notes.md; fi
          cat notes.md

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            assets/
            notes.md
          retention-days: 14

  # Nothing is built or installed here, so a dependency of the build cannot reach the write token.
  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `release` environment is where the owner can require an approval before anything is created (docs/wiki/Security.md);
    # without protection rules on it the job runs as before.
    environment: release
    permissions:
      contents: write
      # Signing the provenance: a short-lived Sigstore certificate for this run, and the attestation stored on the repository.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: out

      # Detached Ed25519 signatures of the two update feeds (CL-174): the app verifies `latest.yml.sig` and `latest-linux.yml.sig`
      # against the public key it embeds before it looks at an installer. Only this job holds the private key, and it runs
      # nothing but openssl and gh with it. Without the secret nothing is signed and the log says so; a build that embeds a
      # key refuses an unsigned feed, so the secret has to exist before such a release is tagged (docs/wiki/Security.md).
      - name: Sign the update feeds
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::notice title=Update feeds not signed::The UPDATE_SIGNING_KEY secret of the release environment is not set, so latest.yml and latest-linux.yml carry no signature."
            exit 0
          fi
          umask 077
          dir=$(mktemp -d)
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$dir/key.pem"
          openssl pkey -in "$dir/key.pem" -pubout -out "$dir/pub.pem"
          for feed in latest.yml latest-linux.yml; do
            openssl pkeyutl -sign -rawin -inkey "$dir/key.pem" -in "out/assets/$feed" -out "$dir/sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "$dir/pub.pem" -in "out/assets/$feed" -sigfile "$dir/sig"
            base64 -w0 "$dir/sig" > "out/assets/$feed.sig"
          done
          rm -rf "$dir"
          (cd out/assets && sha256sum latest.yml.sig latest-linux.yml.sig >> SHA256SUMS.txt)
          echo "::notice title=Update feeds signed::latest.yml.sig and latest-linux.yml.sig are in the release."

      # Build provenance for every file of the release (SLSA, signed through Sigstore, bound to this workflow and commit):
      # `gh attestation verify <file> --repo <owner>/<repo>` tells that a file was built here from this tag and not replaced.
      - name: Attest the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/assets/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -R out | head -50
          test -f out/notes.md && ls out/assets > /dev/null
          flags=(--draft --verify-tag --title "CodeLoupe $VERSION" --notes-file out/notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" out/assets/*
