name: CI

on:
  push:
    branches: [main, "CL-*"]
  pull_request:
  # The release workflow (CL-106) runs the whole of this for a tag, with the version the tag names.
  workflow_call:
    inputs:
      version:
        description: Release version without the v; empty for a development build
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests of the scripts in tools/ (release notes).
  tools:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: node --test tools/*.test.mjs

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Caches ~/.gradle (dependencies, wrapper distribution) keyed on the build files.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Test
        run: ./gradlew test --console=plain --no-daemon
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci fails when the lockfile and package.json disagree. Install scripts stay off: nothing here needs
      # the Electron binary, and esbuild ships its binary as an optional package.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build-${{ matrix.os }}
          path: app/out/
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; the runtime in a bundle runs only on the CPU it was built on, so the Intel Mac
        # installer (CL-120) comes from an Intel runner.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # jlink output only runs on the OS it was built on, hence one bundle per OS.
      - name: Build the bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew bundle --console=plain --no-daemon ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION}
        shell: bash

      # Runs a query with the bundle's launcher on a PATH without any Java and records size and daemon RSS.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Smoke test and measure
        shell: bash
        run: |
          dir=$(ls -d build/bundle/codeloupe-*/ | head -n 1)
          zip=$(ls build/distributions/codeloupe-*.zip | head -n 1)
          node tools/bundle-smoke.mjs "$dir" --zip "$zip" --out bundle-report.json
          {
            echo "### Bundle ${{ matrix.os }}"
            echo '```json'
            cat bundle-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report-${{ matrix.os }}
          path: bundle-report.json
          retention-days: 90

      # Zips are ~150 MB each: kept for main and for a release build (the release attaches them), briefly.
      - name: Upload bundle
        if: github.ref == 'refs/heads/main' || inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: build/distributions/*.zip
          retention-days: 3

      # The Electron installer of this OS around the bundle just built (CL-104). Signing comes with CL-105.
      # Install scripts stay off: electron-builder downloads the Electron it packs itself.
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --ignore-scripts
          # dmgbuild sometimes cannot eject its disk image on a macOS runner ("Resource busy"): a second try works.
          for attempt in 1 2 3; do
            npm run dist -- ${RELEASE_VERSION:+-c.extraMetadata.version=$RELEASE_VERSION} && break
            [ "$attempt" = 3 ] && exit 1
            echo "installer build failed, trying again ($attempt)"
            sleep 15
          done

      # Unpacks the installer without installing it and runs the bundle inside on a PATH without Java: proves the
      # installer carries a working daemon with its runtime. Installing and starting the app is CL-108.
      - name: Check the installer contents
        shell: bash
        run: |
          mkdir unpacked
          case "${{ matrix.os }}" in
            ubuntu-*)
              dpkg-deb -x app/dist/*.deb unpacked/deb
              chmod +x app/dist/*.AppImage
              (cd unpacked && ../app/dist/*.AppImage --appimage-extract > /dev/null)
              ls unpacked/squashfs-root
              test -f unpacked/squashfs-root/codeloupe-desktop
              deb_dir=$(find unpacked/deb -type d -path '*resources/codeloupe' | head -n 1)
              node tools/bundle-smoke.mjs "$deb_dir"
              node tools/bundle-smoke.mjs unpacked/squashfs-root/resources/codeloupe
              ;;
            macos-*)
              hdiutil attach app/dist/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
              cp -R "$RUNNER_TEMP/dmg/CodeLoupe.app" unpacked/
              hdiutil detach "$RUNNER_TEMP/dmg"
              node tools/bundle-smoke.mjs unpacked/CodeLoupe.app/Contents/Resources/codeloupe
              ;;
            windows-*)
              7z x app/dist/CodeLoupe-*-win-*.exe -ounpacked/nsis -y > /dev/null
              # Older 7-Zip leaves the app as a nested archive, newer unpacks it directly.
              if [ -f 'unpacked/nsis/$PLUGINSDIR/app-64.7z' ]; then
                7z x 'unpacked/nsis/$PLUGINSDIR/app-64.7z' -ounpacked/nsis -y > /dev/null
              fi
              app_exe=$(find unpacked/nsis -name CodeLoupe.exe | head -n 1)
              test -n "$app_exe"
              node tools/bundle-smoke.mjs "$(dirname "$app_exe")/resources/codeloupe"
              ;;
          esac
          test -f "$(find unpacked -path '*claude-plugin/.claude-plugin/marketplace.json' | head -n 1)"
          ls -l app/dist | grep -E '.(exe|dmg|AppImage|deb)$' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # Installs each installer for real (CL-108) and runs what a user would: the app starts, it starts the bundled daemon,
  # queries work through the CLI and the MCP endpoint on a PATH without Java, then everything is uninstalled.
  # The release pipeline (CL-106) publishes only when this is green.
  installer-smoke:
    name: installer smoke (${{ matrix.os }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-${{ matrix.os }}
          path: installers

      # `import` takes the screenshot of the virtual display; it is not on the runner image.
      - name: Install ImageMagick
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends imagemagick

      - name: Install, run, query, uninstall
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tools/installer-smoke.mjs installers --shots shots --out installer-smoke.json ${RELEASE_VERSION:+--expect-version $RELEASE_VERSION}
          {
            echo "### Installer smoke ${{ matrix.os }}"
            echo '```json'
            cat installer-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: |
            shots/
            installer-smoke.json
          if-no-files-found: ignore
          retention-days: 14
