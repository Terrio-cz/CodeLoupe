name: CI

on:
  push:
    branches: [main, "CL-*"]
  pull_request:
  # The release workflow (CL-106) runs the whole of this for a tag, with the version the tag names.
  workflow_call:
    inputs:
      version:
        description: Release version without the v; empty for a development build
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit tests of the scripts in tools/ (release notes, manifests, ad hoc signing).
  tools:
    name: tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - run: node --test tools/*.test.mjs

      # Every link of docs/wiki and every wiki link of the README resolves to an existing page, heading or file.
      - run: node tools/check-wiki-links.mjs

  # The winget, Scoop and Homebrew manifests of a release (CL-130) from fixture files, checked by the tools that exist on
  # a runner: the generator's own tests above, `brew style` for the cask here. winget has no hosted runner image.
  manifests:
    name: manifests (macos)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Generate from fixture files and style-check the cask
        run: |
          mkdir fixture
          for n in win-x64.exe mac-arm64.dmg mac-x64.dmg; do echo "$n" > "fixture/CodeLoupe-1.2.3-$n"; done
          (cd fixture && shasum -a 256 CodeLoupe-* > SHA256SUMS.txt)
          node tools/packaging-manifests.mjs --dir fixture --version 1.2.3 --out manifests
          # Homebrew only styles casks that live in a tap: a throwaway local one.
          brew tap-new --no-git local/codeloupe
          tap=$(brew --repository local/codeloupe)
          mkdir -p "$tap/Casks"
          cp manifests/homebrew/Casks/codeloupe.rb "$tap/Casks/"
          brew style --cask local/codeloupe/codeloupe

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # Caches ~/.gradle (dependencies, wrapper distribution) keyed on the build files.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Test
        run: ./gradlew test --console=plain --no-daemon
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci fails when the lockfile and package.json disagree. Install scripts stay off: nothing here needs
      # the Electron binary, and esbuild ships its binary as an optional package.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build-${{ matrix.os }}
          path: app/out/
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; the runtime in a bundle runs only on the CPU it was built on, so the Intel Mac
        # installer (CL-120) comes from an Intel runner.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # jlink output only runs on the OS it was built on, hence one bundle per OS.
      - name: Build the bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./gradlew bundle --console=plain --no-daemon ${RELEASE_VERSION:+-PreleaseVersion=$RELEASE_VERSION}
        shell: bash

      # Runs a query with the bundle's launcher on a PATH without any Java and records size and daemon RSS.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Smoke test and measure
        shell: bash
        run: |
          dir=$(ls -d build/bundle/codeloupe-*/ | head -n 1)
          zip=$(ls build/distributions/codeloupe-*.zip | head -n 1)
          node tools/bundle-smoke.mjs "$dir" --zip "$zip" --out bundle-report.json
          {
            echo "### Bundle ${{ matrix.os }}"
            echo '```json'
            cat bundle-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-report-${{ matrix.os }}
          path: bundle-report.json
          retention-days: 90

      # Zips are ~150 MB each: kept for main and for a release build (the release attaches them), briefly.
      - name: Upload bundle
        if: github.ref == 'refs/heads/main' || inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: build/distributions/*.zip
          retention-days: 3

      # The Electron installer of this OS around the bundle just built (CL-104). Signing comes with CL-105.
      # Install scripts stay off: electron-builder downloads the Electron it packs itself.
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm ci --ignore-scripts
          # dmgbuild sometimes cannot eject its disk image on a macOS runner ("Resource busy"): a second try works.
          for attempt in 1 2 3; do
            npm run dist -- ${RELEASE_VERSION:+-c.extraMetadata.version=$RELEASE_VERSION} && break
            [ "$attempt" = 3 ] && exit 1
            echo "installer build failed, trying again ($attempt)"
            sleep 15
          done

      # Unpacks the installer without installing it and runs the bundle inside on a PATH without Java: proves the
      # installer carries a working daemon with its runtime. Installing and starting the app is CL-108.
      - name: Check the installer contents
        shell: bash
        run: |
          mkdir unpacked
          case "${{ matrix.os }}" in
            ubuntu-*)
              dpkg-deb -x app/dist/*.deb unpacked/deb
              chmod +x app/dist/*.AppImage
              (cd unpacked && ../app/dist/*.AppImage --appimage-extract > /dev/null)
              ls unpacked/squashfs-root
              test -f unpacked/squashfs-root/codeloupe-desktop
              deb_dir=$(find unpacked/deb -type d -path '*resources/codeloupe' | head -n 1)
              node tools/bundle-smoke.mjs "$deb_dir"
              node tools/bundle-smoke.mjs unpacked/squashfs-root/resources/codeloupe
              ;;
            macos-*)
              hdiutil attach app/dist/*.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
              cp -R "$RUNNER_TEMP/dmg/CodeLoupe.app" unpacked/
              hdiutil detach "$RUNNER_TEMP/dmg"
              # Nothing is paid for (CL-105): the app is signed ad hoc (CL-130), which Apple Silicon needs to run it at all.
              codesign -dv unpacked/CodeLoupe.app 2>&1 | tee codesign.txt
              grep -q 'Signature=adhoc' codesign.txt
              codesign --verify --deep --strict --verbose=2 unpacked/CodeLoupe.app
              codesign --verify --strict unpacked/CodeLoupe.app/Contents/Resources/codeloupe/runtime/bin/java
              node tools/bundle-smoke.mjs unpacked/CodeLoupe.app/Contents/Resources/codeloupe
              ;;
            windows-*)
              7z x app/dist/CodeLoupe-*-win-*.exe -ounpacked/nsis -y > /dev/null
              # Older 7-Zip leaves the app as a nested archive, newer unpacks it directly.
              if [ -f 'unpacked/nsis/$PLUGINSDIR/app-64.7z' ]; then
                7z x 'unpacked/nsis/$PLUGINSDIR/app-64.7z' -ounpacked/nsis -y > /dev/null
              fi
              app_exe=$(find unpacked/nsis -name CodeLoupe.exe | head -n 1)
              test -n "$app_exe"
              node tools/bundle-smoke.mjs "$(dirname "$app_exe")/resources/codeloupe"
              ;;
          esac
          test -f "$(find unpacked -path '*claude-plugin/.claude-plugin/marketplace.json' | head -n 1)"
          ls -l app/dist | grep -E '.(exe|dmg|AppImage|deb)$' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          # latest.yml and latest-linux.yml are the update feed (CL-107): the SHA-512 and size of each installer, read by
          # electron-updater. macOS has no feed (it only notifies), so latest-mac.yml stays out; both Macs would write it.
          path: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.AppImage.blockmap
            app/dist/*.deb
            app/dist/latest.yml
            app/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  # Installs each installer for real (CL-108) and runs what a user would: the app starts, it starts the bundled daemon,
  # queries work through the CLI and the MCP endpoint on a PATH without Java, then everything is uninstalled.
  # The release pipeline (CL-106) publishes only when this is green.
  installer-smoke:
    name: installer smoke (${{ matrix.os }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-${{ matrix.os }}
          path: installers

      # `import` takes the screenshot of the virtual display; it is not on the runner image.
      - name: Install ImageMagick
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends imagemagick

      - name: Install, run, query, uninstall
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tools/installer-smoke.mjs installers --shots shots --out installer-smoke.json ${RELEASE_VERSION:+--expect-version $RELEASE_VERSION}
          {
            echo "### Installer smoke ${{ matrix.os }}"
            echo '```json'
            cat installer-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: |
            shots/
            installer-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  # The app updates itself from one build to the next (CL-107), on a real installation and against a local feed: three
  # builds (N, N+1 and one whose daemon cannot start), install N, let it download, verify and install N+1, check that
  # settings, a secret and the daemon's data survive and the daemon runs the new bundle, that a tampered installer is
  # refused and that the failing build falls back to the previous daemon (tools/update-test.mjs). No release, no tag.
  update-test:
    name: update test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the installers of two versions and one with a broken daemon
        shell: bash
        run: |
          targets=
          [ "${{ runner.os }}" = Linux ] && targets="--linux AppImage"
          (cd app && npm ci --ignore-scripts)
          mkdir updates
          for v in 0.0.1-rc.1 0.0.1-rc.2; do
            rm -rf build/bundle
            ./gradlew bundle --console=plain --no-daemon -PreleaseVersion=$v
            (cd app && npm run dist -- -c.extraMetadata.version=$v $targets)
            mkdir "updates/$v"
            cp app/dist/CodeLoupe-$v-* app/dist/latest*.yml "updates/$v/"
            node tools/feed-check.mjs "updates/$v" --version "$v" --feed "$([ "${{ runner.os }}" = Linux ] && echo latest-linux.yml || echo latest.yml)"
          done
          # The third build is the second with a daemon jar that cannot start.
          (cd app && node ../tools/break-bundle.mjs stage/codeloupe 0.0.1-rc.3 && npx electron-builder --publish never -c.extraMetadata.version=0.0.1-rc.3 $targets)
          mkdir updates/0.0.1-rc.3
          cp app/dist/CodeLoupe-0.0.1-rc.3-* app/dist/latest*.yml updates/0.0.1-rc.3/

      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Update from rc.1 to rc.2, refuse a tampered file, roll back from rc.3
        shell: bash
        run: |
          ext=exe; [ "${{ runner.os }}" = Linux ] && ext=AppImage
          os=win-x64; [ "${{ runner.os }}" = Linux ] && os=linux-x86_64
          run=; [ "${{ runner.os }}" = Linux ] && run="xvfb-run -a"
          $run node tools/update-test.mjs \
            --old "updates/0.0.1-rc.1/CodeLoupe-0.0.1-rc.1-$os.$ext" --new "updates/0.0.1-rc.2/CodeLoupe-0.0.1-rc.2-$os.$ext" \
            --bad "updates/0.0.1-rc.3/CodeLoupe-0.0.1-rc.3-$os.$ext" --out update-test.json
          {
            echo "### Update test ${{ matrix.os }}"
            echo '```json'
            node -e "const r=JSON.parse(require('fs').readFileSync('update-test.json','utf8')); delete r.requests; console.log(JSON.stringify(r,null,2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-test-${{ matrix.os }}
          path: update-test.json
          if-no-files-found: ignore
          retention-days: 14
