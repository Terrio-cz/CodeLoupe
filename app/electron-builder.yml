# Installers of the desktop app with the daemon and its Java runtime inside (CL-104). `npm run dist` builds the one
# for the OS and CPU it runs on: jlink output is specific to both, so each installer comes from its own runner.
# Nothing is paid for (CL-105, docs/code-signing.md): the Windows installer is unsigned, the macOS app is signed ad hoc.
appId: cz.terrio.codeloupe
productName: CodeLoupe
copyright: Terrio
directories:
  output: dist
  buildResources: installer
files:
  - out/**/*
  - package.json
  # The renderer is bundled by Vite; main requires Electron, Node and electron-updater (CL-107), which brings its own
  # production dependencies along (electron-builder leaves out the dev tooling).
extraResources:
  # stage/ is filled by scripts/stage-resources.mjs: the Gradle bundle and the Claude Code plugin.
  - from: stage/codeloupe
    to: codeloupe
  - from: stage/claude-plugin
    to: claude-plugin
# Chromium's own strings (spell-check, context menus); the app's text is not translated through them. English only,
# so a Czech OS does not bring Czech Chromium strings into the English UI.
electronLanguages:
  - en-US
artifactName: CodeLoupe-${version}-${os}-${arch}.${ext}
# Flips the Electron fuses, then signs the macOS app ad hoc (scripts/after-pack.mjs; the signature is a no-op on the other platforms).
afterPack: ./scripts/after-pack.mjs
# Auto-update (CL-107). `--publish never` publishes nothing; this makes electron-builder write the feed files
# (latest.yml, latest-linux.yml: SHA-512 and size of each installer) and resources/app-update.yml. The release job attaches
# the feed files to the draft release; the app finds a newer release itself and reads the files from that release's
# directory (app/src/main/update), so no channel names are involved: always `latest`.
publish:
  provider: github
  owner: Terrio-cz
  repo: CodeLoupe
  channel: latest

win:
  target: nsis
  icon: stage/icon.png
nsis:
  # One click, per user: nothing to confirm and no administrator rights, the app starts when the install ends.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # Stops the daemon before files are replaced or removed, and asks about the data on uninstall.
  include: installer/installer.nsh

mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: stage/icon.png
  # No certificate (CL-105: nothing is paid for): without this electron-builder looks for one in the keychain.
  # The app is signed ad hoc by the afterPack hook instead (CL-130).
  identity: null

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: stage/icon.png
  # Not `codeloupe`: that is the CLI, which the bundle ships in resources/codeloupe/bin.
  executableName: codeloupe-desktop
  # A deb needs a maintainer address; this one is a placeholder that goes nowhere until the project has a contact.
  maintainer: Terrio <codeloupe@users.noreply.github.com>
deb:
  # The tray icon needs an appindicator library on some desktops; the rest ships inside the app.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
